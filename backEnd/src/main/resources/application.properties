spring.application.name=GitMatch

# --- Database ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- GitMatch Custom ---
gitmatch.ai.gemini.api-key=${GEMINI_API_KEY}
gitmatch.ai.gemini.model=gemini-3.1-flash-lite-preview
gitmatch.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

gitmatch.github.api-token=${GITHUB_API_TOKEN}
gitmatch.github.min-stars=100
gitmatch.github.max-stars=200000

gitmatch.harvester.cron.repos=0 0 */2 * * *
gitmatch.harvester.cron.news=0 30 */3 * * *

gitmatch.feed.default-page-size=20

# --- Security / Auth ---
gitmatch.security.jwt-secret=${JWT_SECRET}
gitmatch.security.jwt-expiration-ms=86400000
gitmatch.security.encryption-key=${ENCRYPTION_KEY}
gitmatch.security.app-redirect-uri=gitmatch://login

# --- OAuth2 Client Registration ---
spring.security.oauth2.client.registration.github.client-id=${GITHUB_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,public_repo

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.datasource.hikari.maximum-pool-size=5
server.address=0.0.0.0
server.forward-headers-strategy=framework

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
